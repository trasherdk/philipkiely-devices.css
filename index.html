<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devices.css</title>
  <link rel="stylesheet" href="devices.css" type="text/css">
  <script type="module" src="/main.js"></script>
  <style>
    .container {
      width: 200px;
      height: 300px;
      max-width: 100vw;
      max-height: 100vh;
      border: 1px solid black;
      overflow: auto;
      padding: 1rem;
      resize: horizontal;
    }
    .wrapper {
      display: inline-flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .links {
      margin: 0 auto;
      width: fit-content;
    }
    .device-wrapper {
      max-width: 66.666%;
      margin: 0 auto;
    }
    .text-center {
      text-align: center;
    }
    .marvel-device .screen {
      font-size: clamp(8px, calc(24px / var(--size-divisor)), 16px);
    }
    .font-size-indicator {
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="links">
      <p><a target="_blank" href="https://github.com/philipkiely/devices.css">philipkiely/devices.css</a></p>
      <p><a target="_blank" href="https://github.com/trasherdk/devices.css">trasherdk/devices.css</a></p>
    </div>

  <div class="container">
    <div class="device-wrapper">

      <div class="marvel-device iphone8">
        <div class="notch">
          <div class="camera"></div>
          <div class="speaker"></div>
        </div>
        <div class="top-bar"></div>
        <div class="sleep"></div>
        <div class="bottom-bar"></div>
        <div class="volume"></div>
        <div class="overflow">
          <div class="shadow shadow--tr"></div>
          <div class="shadow shadow--tl"></div>
          <div class="shadow shadow--br"></div>
          <div class="shadow shadow--bl"></div>
        </div>
        <div class="inner-shadow"></div>
        <div class="screen text-center">
          <h3>&nbsp;</h3>
          <h3>Content</h3>
          <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
        </div>
      </div>

    </div>

  </div>
  <div class="font-size-indicator" id="font-size-indicator">font-size: —</div>

  </div>
</body>
</html>
